server {
    error_log /var/log/nginx/inboard_error.log;
    access_log /var/log/nginx/inboard_access.log;

    listen 80;

    root /build;

    index /index.html;
    
    location /api/ {
        proxy_pass http://inboard-backend:8080/api/;
    }

    location /api/board/ws/ {
        proxy_pass http://inboard-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}